client_id = "bf8d34866a85f850804a1fe20f86a6ba"
name = "UStudio Local DTF"
application_url = "https://localdtf.uploadstudio.app.techifyboost.com"
embedded = true
handle = "localdtf"

[build]
automatically_update_urls_on_dev = false
dev_store_url = "local-dtf.myshopify.com"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app-uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products-delete"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products-update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders-create"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders-paid"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders-updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders-cancelled"

  [[webhooks.subscriptions]]
  topics = [ "orders/fulfilled" ]
  uri = "/webhooks/orders-fulfilled"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds-create"

[access_scopes]
scopes = "read_customers,read_files,read_orders,read_products,write_draft_orders,write_files,write_orders,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://localdtf.uploadstudio.app.techifyboost.com/auth/callback",
  "https://localdtf.uploadstudio.app.techifyboost.com/api/auth/callback"
]

[app_proxy]
url = "https://localdtf.uploadstudio.app.techifyboost.com"
subpath = "customizer"
prefix = "apps"

[pos]
embedded = false
