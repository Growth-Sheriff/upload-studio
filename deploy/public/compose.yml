# Only an independent NEW host/project. No external network or tenant container.
name: auto-gang-sheet-public
x-app: &app
  image: ${PUBLIC_IMAGE:?Set the independent public image}
  env_file: public.env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=2147483648,mode=1777
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 128
  stop_grace_period: 30s
services:
  web:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  measure:
    <<: *app
    command: ["node", "--import", "tsx", "workers/public-app.worker.ts"]
    environment: {PUBLIC_WORKER_ROLE: measure}
    mem_limit: 4g
    cpus: 2
  preview:
    <<: *app
    command: ["node", "--import", "tsx", "workers/public-app.worker.ts"]
    environment: {PUBLIC_WORKER_ROLE: preview}
    mem_limit: 4g
    cpus: 2
  export:
    <<: *app
    command: ["node", "--import", "tsx", "workers/public-app.worker.ts"]
    environment: {PUBLIC_WORKER_ROLE: export}
    mem_limit: 4g
    cpus: 2
  billing:
    <<: *app
    command: ["node", "--import", "tsx", "workers/public-app.worker.ts"]
    environment: {PUBLIC_WORKER_ROLE: billing}
    mem_limit: 512m
    cpus: 0.5
  privacy:
    <<: *app
    command: ["node", "--import", "tsx", "workers/public-app.worker.ts"]
    environment: {PUBLIC_WORKER_ROLE: privacy}
    mem_limit: 512m
    cpus: 0.5
