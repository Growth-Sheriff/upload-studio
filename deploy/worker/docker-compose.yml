# Upload Studio - background workers on the dedicated worker droplet
# (us-worker-do, 10.124.0.10). The web containers on us-app-do (10.124.0.4)
# run with APP_ROLE=web and never start workers.
#
# One container per tenant: same image and env file as the tenant's web
# container, so both sides always agree on DATABASE_URL, the Redis DB index
# and storage credentials. "redis" resolves to the app droplet's private IP,
# where docker-compose.redis-bridge.yml exposes the shared Redis to the VPC.
#
# deploy/depot.sh deploy copies this file and the tenant env files here and
# runs `docker compose up -d` after the web containers are updated.

x-worker-common: &worker-common
  image: upload-studio:latest
  restart: unless-stopped
  environment:
    APP_ROLE: worker
    MEASURE_CONCURRENCY: "6"
    PREVIEW_CONCURRENCY: "6"
    MEASURE_JOBS_PER_MINUTE: "120"
    PREVIEW_JOBS_PER_MINUTE: "120"
    # The Dockerfile tries to cap this in policy.xml, but Debian ships that
    # line inside an XML comment so the sed is a no-op — `identify -list
    # resource` reported Thread: 8 in production. Without a cap one tenant's
    # `convert` opens eight OpenMP threads and takes every core on the host.
    MAGICK_THREAD_LIMIT: "2"
  extra_hosts:
    - "redis:10.124.0.4"
  # A ceiling, not a reservation: an idle tenant holds ~400 MB, so the ten
  # ceilings deliberately oversubscribe the 32 GB host. Whichever tenant is
  # actually working can take the whole free pool, which is the behaviour a
  # single shared worker would give without also letting one bad file take
  # every tenant down with it.
  #
  # At the old 4 GB the kernel OOM-killed `convert` mid-job (2026-09-24): the
  # dead process stranded the large-image lock and froze every PDF/AI upload
  # on fast for ~20 hours while 11 GB sat unused.
  mem_limit: 8g
  # Lets measure/preview finish in-flight jobs on deploy before SIGKILL.
  stop_grace_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  fastdtftransfer:
    <<: *worker-common
    container_name: usw-fastdtftransfer
    env_file: envs/.env.fastdtftransfer
    # Busiest tenant by far: customers routinely upload 200-700 MB gang sheets.
    mem_limit: 16g

  everydaycustomprint:
    <<: *worker-common
    container_name: usw-everydaycustomprint
    env_file: envs/.env.everydaycustomprint

  dtftransferohio:
    <<: *worker-common
    container_name: usw-dtftransferohio
    env_file: envs/.env.dtftransferohio

  dtfprinthouse:
    <<: *worker-common
    container_name: usw-dtfprinthouse
    env_file: envs/.env.dtfprinthouse

  dtfprintdepot:
    <<: *worker-common
    container_name: usw-dtfprintdepot
    env_file: envs/.env.dtfprintdepot

  eagledtfprint:
    <<: *worker-common
    container_name: usw-eagledtfprint
    env_file: envs/.env.eagledtfprint

  alphaprint:
    <<: *worker-common
    container_name: usw-alphaprint
    env_file: envs/.env.alphaprint

  gangsheet:
    <<: *worker-common
    container_name: usw-gangsheet
    env_file: envs/.env.gangsheet

  legendtransfers:
    <<: *worker-common
    container_name: usw-legendtransfers
    env_file: envs/.env.legendtransfers

  customprintaz:
    <<: *worker-common
    container_name: usw-customprintaz
    env_file: envs/.env.customprintaz

  chillitransfers:
    <<: *worker-common
    container_name: usw-chillitransfers
    env_file: envs/.env.chillitransfers

  dtfnash:
    <<: *worker-common
    container_name: usw-dtfnash
    env_file: envs/.env.dtfnash

  localdtf:
    <<: *worker-common
    container_name: usw-localdtf
    env_file: envs/.env.localdtf

  dtfprintarizona:
    <<: *worker-common
    container_name: usw-dtfprintarizona
    env_file: envs/.env.dtfprintarizona
