# Upload Studio CI — Depot build pipeline
#
# DOCTRINE:
#   GitHub        = source of truth
#   Depot         = build machine (project tq9pqdq9xh)
#   GHCR          = image registry (ghcr.io/jesuisfatih/upload-studio)
#   DigitalOcean  = runtime host (`upload-studio` -> 64.227.108.45; NEVER builds)
#
# Pushing to main only BUILDS and PUSHES the image. Deploying to production is
# a separate, manually dispatched job that requires typing "deploy" — the old
# workflow auto-deployed on every main push (and still pointed at the retired
# Vultr host path), which is exactly the accident this layout prevents.
#
# Required repo secrets:
#   DEPOT_TOKEN   — Depot project/org API token (depot.dev -> settings)
#   DO_SSH_KEY    — private key for root@64.227.108.45 (deploy job only)
#   DO_HOST       — 64.227.108.45 (deploy job only)

name: Build (Depot) & Manual Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to deploy the built image to production'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/jesuisfatih/upload-studio

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Depot OIDC (if project trust is configured)
    steps:
      - uses: actions/checkout@v4

      - uses: depot/setup-action@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Depot build & push
        env:
          DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
        run: |
          depot build . \
            --project tq9pqdq9xh \
            --platform linux/amd64 \
            -t "$IMAGE:${GITHUB_SHA::12}" \
            -t "$IMAGE:latest" \
            --push
          echo "Pushed $IMAGE:${GITHUB_SHA::12}"

  deploy:
    # Manual only, and only when the operator literally typed "deploy".
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'deploy'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image & restart tenants (DigitalOcean)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            SHA="${{ github.sha }}"
            SHORT="${SHA:0:12}"
            echo "=== [1/3] Pull ghcr.io/jesuisfatih/upload-studio:$SHORT ==="
            docker pull "ghcr.io/jesuisfatih/upload-studio:$SHORT"
            docker tag "ghcr.io/jesuisfatih/upload-studio:$SHORT" upload-studio:latest

            echo "=== [2/3] Restart Containers ==="
            cd /opt/apps/public/upload-studio
            # NEVER --remove-orphans here. docker-compose.yml declares only the
            # ten tenants, while Caddy (docker-compose.caddy.yml) and the Redis
            # bridge (docker-compose.redis-bridge.yml) join the SAME
            # `upload-studio` project from separate files. Compose would treat
            # them as orphans and delete them, taking every storefront offline.
            docker compose up -d

            echo "=== [2b/3] Worker droplet ==="
            # This job only ever updated the web droplet, so the workers kept
            # running the previous image while the web side moved forward.
            # deploy/depot.sh is the supported path and updates both; use it
            # instead of this job for anything that changes worker code.
            echo "WARNING: workers on us-worker-do are NOT updated by this job."
            echo "         Run: CONFIRM_DEPLOY=yes ./deploy/depot.sh deploy <sha>"

            echo "=== [3/3] Health Check (retry 3x) ==="
            for attempt in 1 2 3; do
              echo "Attempt $attempt - waiting 90s..."
              sleep 90
              FAILED=0
              for name in fastdtftransfer everydaycustomprint dtftransferohio dtfprinthouse dtfprintdepot eagledtfprint alphaprint gangsheet legendtransfers customprintaz; do
                port=$(docker port us-$name 3000/tcp 2>/dev/null | cut -d: -f2)
                code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:$port/health 2>/dev/null)
                echo "$name (:$port): $code"
                if [ "$code" != "200" ]; then
                  FAILED=$((FAILED+1))
                fi
              done
              if [ $FAILED -eq 0 ]; then
                echo "All 10 tenants healthy!"
                exit 0
              fi
              echo "$FAILED tenant(s) not ready yet..."
            done
            echo "Some tenants failed after 3 attempts"
            exit 1
