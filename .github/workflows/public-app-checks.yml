name: Public application checks
on:
  push:
    branches: [public-app]
  pull_request:
    branches: [public-app]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: public_app
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: public_app_test
        ports: [55439:5432]
        options: --health-cmd "pg_isready -U public_app -d public_app_test" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://public_app:local-test-only@127.0.0.1:55439/public_app_test?schema=public
      PUBLIC_TENANCY_TEST_DATABASE_URL: postgresql://public_app:local-test-only@127.0.0.1:55439/public_app_test?schema=public
      PUBLIC_APP_TEST_DATABASE_URL: postgresql://public_app:local-test-only@127.0.0.1:55439/public_app_test?schema=public
      PUBLIC_TENANCY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_URL: redis://127.0.0.1:6379/0
      PUBLIC_APP_RUNTIME: 'true'
      SHOPIFY_API_KEY: test-public-app-only
      SHOPIFY_API_SECRET: test-public-secret-only
      SHOPIFY_APP_URL: https://public-test.example.com
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && corepack prepare pnpm@11.21.0 --activate
      - run: sudo apt-get update && sudo apt-get install -y imagemagick ghostscript poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma generate
      - run: pnpm exec vitest run
      - run: pnpm exec tsc --pretty false
      - run: pnpm run measurement:regression
      - run: pnpm run build
